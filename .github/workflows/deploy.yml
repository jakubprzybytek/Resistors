name: Deploy to Int

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → AWS (agent-playbook/aws-github-deploy)
    concurrency:
      group: deploy-int
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Run unit tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-Resistors
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-resistors-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Deploy to Int
        run: npm run sst:deploy:int -- --print-logs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests against int
        run: npm run test:e2e:int
